    .bg   { fill: var(--paper); }
    .i    { fill: var(--ink); }
    .m    { fill: var(--muted); }
    .a    { fill: var(--accent); }
    .as   { fill: var(--accent-soft); }
    .rk   { stroke: var(--ink); stroke-width: 1.2; }
    .rk-h { stroke: var(--ink); stroke-width: 1.6; }
    .sans { font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .serif{ font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif; }
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", "Courier New", monospace; }
  </style>

