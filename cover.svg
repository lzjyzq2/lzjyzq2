<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" role="img" aria-label="lzjyzq2 — Issue 01 / 第一期, A Culture & Code Review">
  <style>
    :root {
      --paper: #F4EFE6;
      --ink: #16140F;
      --muted: #6F6A5E;
      --accent: #C8372F;
      --accent-soft: rgba(200,55,47,0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12110D;
        --ink: #F2EEE4;
        --muted: #9B9588;
        --accent: #FF5A52;
        --accent-soft: rgba(255,90,82,0.14);
      }
